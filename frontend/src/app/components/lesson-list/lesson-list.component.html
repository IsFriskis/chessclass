<div class="lesson-list-container">
  <div class="controls">
    <button class="btn btn-primary" (click)="showAddLessonForm()" *ngIf="!isAddingLesson">
      Add New Lesson
    </button>
  </div>

  <div class="add-lesson-form" *ngIf="isAddingLesson">
    <h2>Add New Lesson</h2>
    <form (ngSubmit)="addLesson()">
      <div class="form-group">
        <label for="title">Title:</label>
        <input type="text" id="title" [(ngModel)]="newLesson.title" name="title" required>
      </div>
      
      <div class="form-group">
        <label for="description">Description:</label>
        <textarea id="description" [(ngModel)]="newLesson.description" name="description" rows="4" required></textarea>
      </div>
      
      <div class="form-group">
        <label for="level">Level:</label>
        <select id="level" [(ngModel)]="newLesson.level" name="level">
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
      </div>
      
      <div class="form-actions">
        <button type="submit" class="btn btn-success">Save</button>
        <button type="button" class="btn btn-secondary" (click)="hideAddLessonForm()">Cancel</button>
      </div>
    </form>
  </div>

  <div class="lessons-grid">
    <div class="lesson-card" *ngFor="let lesson of lessons">
      <div class="lesson-header">
        <h3>{{ lesson.title }}</h3>
        <span class="level-badge" [class]="lesson.level">{{ lesson.level }}</span>
      </div>
      <p class="lesson-description">{{ lesson.description }}</p>
      <div class="lesson-actions">
        <button class="btn btn-danger btn-sm" (click)="deleteLesson(lesson.id)">Delete</button>
      </div>
    </div>
  </div>

  <div class="empty-state" *ngIf="lessons.length === 0 && !isAddingLesson">
    <p>No lessons available. Add your first lesson to get started!</p>
  </div>
</div>
